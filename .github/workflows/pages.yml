name: Publish project website
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Assemble the static site
        run: |
          mkdir -p site/assets
          cp docs/screenshots/terminal.png docs/screenshots/files.png docs/screenshots/monitoring.png docs/screenshots/security.png docs/screenshots/desktop.png site/assets/
          cp -R helper-tool site/helper-tool
          test -s site/index.html
          node --check site/site.js
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: site
          name: pages-${{ github.run_attempt }}
      - name: Deploy to GitHub Pages
        id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        with:
          artifact_name: pages-${{ github.run_attempt }}
